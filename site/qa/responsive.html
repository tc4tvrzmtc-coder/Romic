<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ROMIC — בדיקת תצוגה</title>
  <style>
    body{margin:0;padding:16px;background:#e8e4e7;color:#241f23;font:16px Arial,sans-serif}
    header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
    h1{font-size:18px;margin:0}select{font:inherit;padding:8px}
    iframe{display:block;width:375px;height:812px;border:1px solid #777;background:white;margin:auto}
  </style>
</head>
<body>
  <header><h1>ROMIC — בדיקת תצוגה</h1>
    <label>רוחב <select id="width"><option>320</option><option selected>375</option><option>390</option><option>430</option><option>1280</option></select></label>
    <label>שפה <select id="language"><option value="he">עברית</option><option value="en">English</option></select></label>
    <label>עמוד <select id="page"><option value="">בית</option><option value="product-cloud-nine.html?color=pink">CLOUD NINE</option><option value="product-marrakech.html">Marrakech</option><option value="product-soho.html">SOHO</option><option value="accessibility.html">נגישות</option><option value="privacy.html">פרטיות</option><option value="terms.html">תנאים</option></select></label>
    <label><input id="spacing" type="checkbox">ריווח טקסט לבדיקת נגישות</label>
  </header>
  <main id="main" tabindex="-1"><iframe title="תצוגת האתר ברוחב שנבחר" src="../he/?v=romic-delivery-logo-20261003"></iframe></main>
  <script>
    const preview=document.querySelector('iframe');
    const loadPage=()=>preview.src='../'+document.querySelector('#language').value+'/'+document.querySelector('#page').value;
    const spacing=()=>{
      const d=preview.contentDocument;if(!d)return;
      let style=d.querySelector('[data-qa-spacing]');
      if(!style){style=d.createElement('style');style.dataset.qaSpacing='';style.textContent='html.qa-spacing *{line-height:1.5!important;letter-spacing:.12em!important;word-spacing:.16em!important}html.qa-spacing p{margin-block-end:2em!important}';d.head.append(style);}
      d.documentElement.classList.toggle('qa-spacing',document.querySelector('#spacing').checked);
    };
    document.querySelector('#width').addEventListener('change',event=>preview.style.width=event.target.value+'px');
    document.querySelector('#language').addEventListener('change',loadPage);
    document.querySelector('#page').addEventListener('change',loadPage);
    document.querySelector('#spacing').addEventListener('change',spacing);preview.addEventListener('load',spacing);
  </script>
</body>
</html>
