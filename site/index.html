<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Romic — Choose language</title><link rel="stylesheet" href="language.css"><link rel="prefetch" href="styles.css" as="style"><link rel="prefetch" href="data.js" as="script"><link rel="prefetch" href="app.js" as="script"></head><body class="language-page"><main class="language-choice" aria-labelledby="language-title"><div class="language-brand"><span class="brand-name">ROMIC</span><span class="brand-sub">HANDMADE BAGS</span></div><div><p>HANDMADE IN ISRAEL</p><h1 id="language-title">CHOOSE YOUR<br>LANGUAGE.</h1></div><nav aria-label="Choose language"><a href="he/" lang="he" dir="rtl" data-language-choice="he">עברית</a><a href="en/" data-language-choice="en">English</a></nav></main><script>(()=>{let saved='';try{saved=localStorage.getItem('romic:language')||''}catch{}if(saved==='he'||saved==='en'){location.replace(`./${saved}/`);return}document.querySelectorAll('[data-language-choice]').forEach(link=>link.addEventListener('click',()=>{document.querySelector('.language-choice')?.setAttribute('aria-busy','true');link.classList.add('is-selected');try{localStorage.setItem('romic:language',link.dataset.languageChoice)}catch{}}))})();</script></body></html>
